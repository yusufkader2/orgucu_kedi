<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#f5e6d3" />
<title>Örgücü Kedi - Wool Cat Puzzle</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: #ead5bc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #f9efe2 0%, #e4cbb0 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 520px;
    box-shadow: 0 12px 40px rgba(70, 42, 20, 0.22);
    background: #f5e6d3;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- SAFE AREA & RESPONSIVE METRICS ---
  function getSafeInsets() {
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;visibility:hidden;';
    document.body.appendChild(div);
    const r = div.getBoundingClientRect();
    const top = Math.max(0, r.top);
    const bottom = Math.max(0, window.innerHeight - r.bottom);
    document.body.removeChild(div);
    return { top, bottom };
  }

  let W = 390, H = 844, DPR = Math.min(window.devicePixelRatio || 1, 3);
  let safeTop = 12, safeBottom = 14;

  function resize() {
    const app = document.getElementById('app');
    const rect = app.getBoundingClientRect();
    W = Math.min(rect.width, 520);
    H = rect.height;
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const insets = getSafeInsets();
    safeTop = Math.max(10, insets.top);
    safeBottom = Math.max(12, insets.bottom);
    layoutUI();
  }

  // --- LOCAL STORAGE & PROGRESS ---
  const STORAGE_KEY = 'orgucu_kedi_save_v1';
  const defaultSave = {
    level: 1,
    coins: 120,
    lang: 'tr',
    sound: true,
    boosters: { clearSlot: 2, target: 2, shuffle: 2, auto: 1 },
    ownedItems: ['none'],
    equippedItem: 'none'
  };
  let save = { ...defaultSave };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) save = { ...defaultSave, ...JSON.parse(raw), boosters: { ...defaultSave.boosters, ...(JSON.parse(raw).boosters || {}) } };
  } catch (e) {}

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); } catch (e) {}
  }

  // --- AD & MONETIZATION BRIDGE (CAPACITOR / ADMOB READY) ---
  window.AdBridge = {
    isAdsRemoved: false,
    showRewarded(reason, onReward) {
      // Gerçek AdMob entegrasyonunda burası @capacitor-community/admob çağırır
      openAdSimulation(reason, onReward);
    },
    showInterstitial(onDone) {
      if (this.isAdsRemoved) { if (onDone) onDone(); return; }
      if (onDone) onDone();
    }
  };

  // --- I18N ---
  const I18N = {
    tr: {
      level: 'Seviye',
      boss: 'BOSS SEVİYE',
      rackTitle: 'BEKLEME TEZGAHI',
      loseTitle: 'TEZGAH DOLDU!',
      loseSub: 'Kedi kahkahalarla gülüyor...',
      winTitle: 'BÖLÜM TAMAM!',
      winSub: 'Kedi sinirlendi! Sıradaki bölüme geç!',
      reviveBtn: 'Reklam İzle & Devam Et (2 Yuva Sil)',
      restartBtn: 'Tekrar Dene',
      nextBtn: 'Sonraki Bölüm',
      doubleBtn: 'Reklam İzle & 2x Altın',
      wardrobe: 'Kedi Gardırobu',
      close: 'Kapat',
      equip: 'Tak',
      equipped: 'Takılı',
      adFree: 'Reklam İzle (+1)',
      adSimTitle: 'Ödüllü Reklam Simülasyonu',
      adSimDesc: 'Mağaza sürümünde burada Google AdMob ödüllü video reklamı oynar.',
      claimReward: 'Ödülü Al',
      combo: 'ATEŞLİ KOMBO 2x!',
      targetHint: 'İstediğin bir yumağa dokun!',
      items: {
        none: 'Sade Kedi',
        bow: 'Kırmızı Papyon',
        glasses: 'Güneş Gözlüğü',
        crown: 'Kral Tacı',
        wizard: 'Büyücü Şapkası'
      }
    },
    en: {
      level: 'Level',
      boss: 'BOSS LEVEL',
      rackTitle: 'WAITING RACK',
      loseTitle: 'RACK IS FULL!',
      loseSub: 'The cat is laughing at you...',
      winTitle: 'STAGE CLEARED!',
      winSub: 'The cat is furious! Move on!',
      reviveBtn: 'Watch Ad & Continue (Clear 2)',
      restartBtn: 'Try Again',
      nextBtn: 'Next Level',
      doubleBtn: 'Watch Ad & 2x Coins',
      wardrobe: 'Cat Wardrobe',
      close: 'Close',
      equip: 'Equip',
      equipped: 'Equipped',
      adFree: 'Watch Ad (+1)',
      adSimTitle: 'Rewarded Ad Simulation',
      adSimDesc: 'In the store build, a Google AdMob rewarded video plays here.',
      claimReward: 'Claim Reward',
      combo: 'FEVER COMBO 2x!',
      targetHint: 'Tap any yarn ball to launch!',
      items: {
        none: 'Classic Cat',
        bow: 'Red Bowtie',
        glasses: 'Cool Shades',
        crown: 'Royal Crown',
        wizard: 'Wizard Hat'
      }
    }
  };
  const t = (k) => I18N[save.lang][k] || k;

  // --- SOUND ENGINE (WEB AUDIO) ---
  let audioCtx = null;
  function playTone(freq, type = 'sine', dur = 0.12, vol = 0.12, slide = 0) {
    if (!save.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    tap: () => playTone(520, 'triangle', 0.09, 0.12, 180),
    blocked: () => playTone(160, 'sawtooth', 0.12, 0.08, -40),
    bucketHit: () => { playTone(660, 'sine', 0.12, 0.14, 220); },
    bucketFull: () => {
      playTone(523, 'triangle', 0.12, 0.14);
      setTimeout(() => playTone(659, 'triangle', 0.12, 0.14), 70);
      setTimeout(() => playTone(784, 'triangle', 0.18, 0.16), 140);
    },
    rack: () => playTone(310, 'sine', 0.11, 0.1, -50),
    win: () => {
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.18, 0.15), i * 90));
    },
    lose: () => {
      [380, 330, 280, 220].forEach((f, i) => setTimeout(() => playTone(f, 'sawtooth', 0.16, 0.1), i * 110));
    }
  };

  // --- COLOR PALETTE ---
  const COLORS = [
    { id: 'red',    main: '#e84545', light: '#ff7b7b', dark: '#a61c1c' },
    { id: 'blue',   main: '#2b8cbe', light: '#6ec4f2', dark: '#15557a' },
    { id: 'yellow', main: '#f2b705', light: '#ffe066', dark: '#b38000' },
    { id: 'green',  main: '#38a169', light: '#7ae0a8', dark: '#1f6640' },
    { id: 'purple', main: '#805ad5', light: '#b794f4', dark: '#4c2c96' },
    { id: 'pink',   main: '#ed64a6', light: '#fbb6ce', dark: '#9c2b63' }
  ];

  // --- GAME STATE ---
  let grid = [];
  let cols = 6, rows = 6;
  let buckets = []; // queue of buckets: { colors: [c1, c2?], counts: [0,0], maxPerColor: 3, isRainbow: false }
  let rack = []; // up to 4 yarn balls
  let flyingBalls = [];
  let particles = [];
  let knittedGifts = [];
  let streak = 0;
  let targetMode = false;
  let gameState = 'playing'; // playing | win | lose | wardrobe | adsim
  let adSimPayload = null;
  let catMood = 'idle'; // idle | sulk | angry | laugh | smug | sweat
  let catMoodTimer = 0;
  let shakeTimer = 0;
  let earnedCoinsThisLevel = 0;
  let doubledClaimed = false;

  // Layout regions
  let UI = {};
  function layoutUI() {
    const topBarH = 46;
    const topY = safeTop + 6;
    const catAreaY = topY + topBarH + 4;
    const catAreaH = Math.min(185, H * 0.235);
    const rackY = catAreaY + catAreaH + 6;
    const rackH = 68;
    const boosterH = 66;
    const boosterY = H - safeBottom - boosterH - 6;
    const boardTop = rackY + rackH + 12;
    const boardBottom = boosterY - 12;
    const boardH = Math.max(200, boardBottom - boardTop);
    const boardW = W - 28;

    UI = {
      topY, topBarH,
      catAreaY, catAreaH,
      rackY, rackH,
      boardX: 14, boardY: boardTop, boardW, boardH,
      boosterY, boosterH,
      buttons: {
        sound: { x: 14, y: topY, w: 40, h: 40 },
        lang:  { x: 60, y: topY, w: 46, h: 40 },
        shop:  { x: W - 54, y: topY, w: 40, h: 40 }
      }
    };
  }

  // --- SOLVABLE LEVEL GENERATOR ---
  const DIRS = [
    { dx: 0, dy: -1, name: 'U' },
    { dx: 1, dy: 0,  name: 'R' },
    { dx: 0, dy: 1,  name: 'D' },
    { dx: -1, dy: 0, name: 'L' }
  ];

  function generateLevel(lvl) {
    gameState = 'playing';
    rack = [];
    flyingBalls = [];
    particles = [];
    knittedGifts = [];
    streak = 0;
    targetMode = false;
    catMood = 'idle';
    catMoodTimer = 0;
    doubledClaimed = false;

    const isBoss = lvl % 5 === 0;
    const numColors = lvl === 1 ? 3 : (lvl <= 3 ? 4 : (lvl <= 7 ? 5 : 6));
    const activeColors = COLORS.slice(0, numColors);

    cols = lvl === 1 ? 5 : 6;
    rows = lvl === 1 ? 4 : (lvl <= 4 ? 5 : 6);

    // Ensure total cells is a multiple of 3 (or 6 for boss)
    let totalCells = cols * rows;
    const rem = totalCells % 3;
    const disabledSet = new Set();
    if (rem !== 0) {
      // leave corners empty so count is divisible by 3
      const corners = [`0,0`, `${cols-1},0`, `0,${rows-1}`, `${cols-1},${rows-1}`];
      for (let i = 0; i < rem; i++) disabledSet.add(corners[i]);
      totalCells -= rem;
    }

    // Build color pool in triplets
    const tripletsCount = totalCells / 3;
    const colorPool = [];
    const bucketPlan = [];

    for (let i = 0; i < tripletsCount; i++) {
      const c = activeColors[i % activeColors.length];
      colorPool.push(c, c, c);
      bucketPlan.push(c);
    }

    // Shuffle color pool
    for (let i = colorPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [colorPool[i], colorPool[j]] = [colorPool[j], colorPool[i]];
    }

    // Create empty grid
    grid = [];
    let poolIdx = 0;
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        if (disabledSet.has(`${c},${r}`)) {
          row.push(null);
        } else {
          const specialRoll = Math.random();
          let special = 'normal';
          if (lvl >= 3 && specialRoll < 0.08) special = 'bomb';
          else if (lvl >= 2 && specialRoll < 0.18) special = 'mystery';
          row.push({
            c, r,
            color: colorPool[poolIdx++],
            dir: DIRS[0],
            special,
            revealed: special !== 'mystery',
            shake: 0,
            scale: 1
          });
        }
      }
      grid.push(row);
    }

    // Guarantee 100% solvability by simulating reverse extraction
    const remaining = new Set();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c]) remaining.add(`${c},${r}`);
      }
    }

    let safety = 0;
    while (remaining.size > 0 && safety < 500) {
      safety++;
      const candidates = [];
      remaining.forEach(key => {
        const [cx, cy] = key.split(',').map(Number);
        const validDirs = DIRS.filter(d => {
          let nx = cx + d.dx, ny = cy + d.dy;
          while (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
            if (remaining.has(`${nx},${ny}`)) return false;
            nx += d.dx;
            ny += d.dy;
          }
          return true;
        });
        if (validDirs.length > 0) candidates.push({ cx, cy, validDirs });
      });

      if (candidates.length > 0) {
        const pick = candidates[Math.floor(Math.random() * candidates.length)];
        const d = pick.validDirs[Math.floor(Math.random() * pick.validDirs.length)];
        grid[pick.cy][pick.cx].dir = d;
        remaining.delete(`${pick.cx},${pick.cy}`);
      } else {
        // Fallback: force clear outermost remaining item
        const firstKey = remaining.values().next().value;
        const [fx, fy] = firstKey.split(',').map(Number);
        grid[fy][fx].dir = DIRS[0];
        remaining.delete(firstKey);
      }
    }

    // Build buckets queue
    // Shuffle bucketPlan slightly so colors feel natural
    for (let i = bucketPlan.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bucketPlan[i], bucketPlan[j]] = [bucketPlan[j], bucketPlan[i]];
    }

    buckets = [];
    if (isBoss && bucketPlan.length >= 2) {
      // First bucket is a big 6-capacity Boss Bucket
      const b1 = bucketPlan.shift();
      const b2 = bucketPlan.shift();
      buckets.push({
        colors: [b1, b2],
        counts: [0, 0],
        maxPerColor: 3,
        isBoss: true,
        isRainbow: false
      });
    }

    for (let i = 0; i < bucketPlan.length; i++) {
      // From level 4+, occasionally create a Dual-Color bucket
      if (lvl >= 4 && i + 1 < bucketPlan.length && bucketPlan[i].id !== bucketPlan[i+1].id && Math.random() < 0.25) {
        buckets.push({
          colors: [bucketPlan[i], bucketPlan[i+1]],
          counts: [0, 0],
          maxPerColor: 3,
          isBoss: false,
          isRainbow: false
        });
        i++;
      } else {
        const isRainbow = lvl >= 6 && i === Math.floor(bucketPlan.length / 2) && Math.random() < 0.35;
        buckets.push({
          colors: [bucketPlan[i]],
          counts: [0],
          maxPerColor: 3,
          isBoss: false,
          isRainbow
        });
      }
    }

    updateRevealed();
  }

  function isBallFree(ball) {
    if (!ball) return false;
    let nx = ball.c + ball.dir.dx;
    let ny = ball.r + ball.dir.dy;
    while (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
      if (grid[ny][nx] !== null) return false;
      nx += ball.dir.dx;
      ny += ball.dir.dy;
    }
    return true;
  }

  function updateRevealed() {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const b = grid[r][c];
        if (b && b.special === 'mystery' && !b.revealed) {
          if (isBallFree(b)) b.revealed = true;
        }
      }
    }
  }

  // --- BUCKET & RACK MATCHING LOGIC ---
  function canBucketAccept(bucket, colorId) {
    if (!bucket) return false;
    if (bucket.isRainbow) {
      return bucket.counts[0] < bucket.maxPerColor;
    }
    for (let i = 0; i < bucket.colors.length; i++) {
      if (bucket.colors[i].id === colorId && bucket.counts[i] < bucket.maxPerColor) {
        return true;
      }
    }
    return false;
  }

  function addColorToBucket(bucket, colorId) {
    if (bucket.isRainbow) {
      bucket.counts[0]++;
      return;
    }
    for (let i = 0; i < bucket.colors.length; i++) {
      if (bucket.colors[i].id === colorId && bucket.counts[i] < bucket.maxPerColor) {
        bucket.counts[i]++;
        return;
      }
    }
  }

  function isBucketComplete(bucket) {
    if (!bucket) return false;
    return bucket.counts.every(cnt => cnt >= bucket.maxPerColor);
  }

  function getBucketCoords() {
    return {
      x: W * 0.5,
      y: UI.catAreaY + UI.catAreaH * 0.68
    };
  }

  function getRackSlotCoords(idx) {
    const totalW = Math.min(W - 44, 320);
    const startX = (W - totalW) * 0.5;
    const slotW = totalW / 4;
    return {
      x: startX + slotW * (idx + 0.5),
      y: UI.rackY + UI.rackH * 0.56
    };
  }

  function getCellCenter(c, r) {
    const cellSize = Math.min(UI.boardW / cols, UI.boardH / rows);
    const totalGridW = cellSize * cols;
    const totalGridH = cellSize * rows;
    const ox = UI.boardX + (UI.boardW - totalGridW) * 0.5;
    const oy = UI.boardY + (UI.boardH - totalGridH) * 0.5;
    return {
      x: ox + (c + 0.5) * cellSize,
      y: oy + (r + 0.5) * cellSize,
      radius: cellSize * 0.41
    };
  }

  function spawnParticles(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const spd = 1.5 + Math.random() * 3.8;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1,
        life: 1,
        color,
        r: 3 + Math.random() * 4
      });
    }
  }

  function launchBall(ball) {
    const pos = getCellCenter(ball.c, ball.r);
    grid[ball.r][ball.c] = null;
    ball.revealed = true;

    // Bomb effect: reveal mystery neighbors around it
    if (ball.special === 'bomb') {
      spawnParticles(pos.x, pos.y, '#ff9f1c', 22);
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = ball.r + dr, nc = ball.c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc]) {
            grid[nr][nc].revealed = true;
            grid[nr][nc].shake = 0.4;
          }
        }
      }
    }

    updateRevealed();
    sfx.tap();

    const curBucket = buckets[0];
    const goesToBucket = canBucketAccept(curBucket, ball.color.id);

    if (goesToBucket) {
      streak++;
      const dest = getBucketCoords();
      flyingBalls.push({
        sx: pos.x, sy: pos.y,
        cx: (pos.x + dest.x) * 0.5 + (pos.x < W * 0.5 ? -55 : 55),
        cy: Math.min(pos.y, dest.y) - 65,
        tx: dest.x, ty: dest.y,
        t: 0,
        speed: 0.055,
        color: ball.color,
        toBucket: true,
        isFever: streak >= 3
      });
    } else {
      streak = 0;
      const targetSlot = rack.length;
      if (targetSlot >= 4) return;
      // Reserve slot visually
      const dest = getRackSlotCoords(targetSlot);
      rack.push({ color: ball.color, hiddenWhileFlying: true });
      flyingBalls.push({
        sx: pos.x, sy: pos.y,
        cx: (pos.x + dest.x) * 0.5,
        cy: Math.min(pos.y, dest.y) - 40,
        tx: dest.x, ty: dest.y,
        t: 0,
        speed: 0.065,
        color: ball.color,
        toBucket: false,
        rackIndex: targetSlot
      });
    }
  }

  function pullMatchingFromRack() {
    const curBucket = buckets[0];
    if (!curBucket) return;
    let moved = false;
    for (let i = 0; i < rack.length; i++) {
      const item = rack[i];
      if (!item.hiddenWhileFlying && canBucketAccept(curBucket, item.color.id)) {
        const from = getRackSlotCoords(i);
        const dest = getBucketCoords();
        rack.splice(i, 1);
        i--;
        moved = true;
        flyingBalls.push({
          sx: from.x, sy: from.y,
          cx: (from.x + dest.x) * 0.5 + (Math.random() - 0.5) * 40,
          cy: dest.y - 35,
          tx: dest.x, ty: dest.y,
          t: 0,
          speed: 0.075,
          color: item.color,
          toBucket: true,
          isFever: streak >= 3
        });
      }
    }
    if (moved) sfx.tap();
  }

  function checkEndConditions() {
    if (flyingBalls.length > 0) return;

    // Check if all buckets done
    if (buckets.length === 0) {
      gameState = 'win';
      catMood = 'angry';
      earnedCoinsThisLevel = (save.level % 5 === 0 ? 50 : 25) + (streak >= 3 ? 10 : 0);
      save.coins += earnedCoinsThisLevel;
      save.level++;
      persist();
      sfx.win();
      return;
    }

    // Check if rack is full (4/4) and current bucket can't take any from rack
    if (rack.length >= 4 && rack.every(r => !r.hiddenWhileFlying)) {
      const cur = buckets[0];
      const hasMatch = rack.some(r => canBucketAccept(cur, r.color.id));
      if (!hasMatch) {
        gameState = 'lose';
        catMood = 'laugh';
        sfx.lose();
      }
    }
  }

  // --- UPDATE LOOP ---
  let lastTime = 0;
  function update(dt) {
    if (catMoodTimer > 0) {
      catMoodTimer -= dt;
      if (catMoodTimer <= 0 && gameState === 'playing') {
        catMood = rack.length >= 3 ? 'smug' : 'idle';
      }
    } else if (gameState === 'playing') {
      const cur = buckets[0];
      const totalFilled = cur ? cur.counts.reduce((a, b) => a + b, 0) : 0;
      const totalCap = cur ? cur.counts.length * cur.maxPerColor : 3;
      if (rack.length >= 3) catMood = 'smug';
      else if (totalFilled >= totalCap - 1) catMood = 'sweat';
      else catMood = 'idle';
    }

    if (shakeTimer > 0) shakeTimer -= dt;

    // Update grid shake
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c] && grid[r][c].shake > 0) {
          grid[r][c].shake = Math.max(0, grid[r][c].shake - dt * 2.5);
        }
      }
    }

    // Update flying balls
    for (let i = flyingBalls.length - 1; i >= 0; i--) {
      const fb = flyingBalls[i];
      fb.t += fb.speed * (dt * 60);
      if (fb.isFever) {
        particles.push({
          x: quadBezier(fb.sx, fb.cx, fb.tx, Math.min(1, fb.t)),
          y: quadBezier(fb.sy, fb.cy, fb.ty, Math.min(1, fb.t)),
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2,
          life: 0.7,
          color: '#ff9f1c',
          r: 5
        });
      }

      if (fb.t >= 1) {
        flyingBalls.splice(i, 1);
        if (fb.toBucket) {
          const cur = buckets[0];
          if (cur && canBucketAccept(cur, fb.color.id)) {
            addColorToBucket(cur, fb.color.id);
            sfx.bucketHit();
            spawnParticles(fb.tx, fb.ty, fb.color.main, 12);

            if (isBucketComplete(cur)) {
              sfx.bucketFull();
              spawnParticles(fb.tx, fb.ty, '#ffd166', 24);
              // Spawn little knitted sweater/scarf flying up
              knittedGifts.push({
                x: fb.tx, y: fb.ty - 10,
                vy: -2.2, life: 1,
                color: cur.colors[0].main
              });
              buckets.shift();
              // Natural sulk expression when bucket completes
              catMood = 'sulk';
              catMoodTimer = 1.6;
              setTimeout(() => pullMatchingFromRack(), 120);
            }
          }
        } else {
          if (rack[fb.rackIndex]) {
            rack[fb.rackIndex].hiddenWhileFlying = false;
          }
          sfx.rack();
          spawnParticles(fb.tx, fb.ty, fb.color.main, 8);
          pullMatchingFromRack();
        }
        checkEndConditions();
      }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life -= dt * 1.8;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Update knitted gifts
    for (let i = knittedGifts.length - 1; i >= 0; i--) {
      const g = knittedGifts[i];
      g.y += g.vy;
      g.life -= dt * 0.9;
      if (g.life <= 0) knittedGifts.splice(i, 1);
    }
  }

  function quadBezier(p0, p1, p2, t) {
    const inv = 1 - t;
    return inv * inv * p0 + 2 * inv * t * p1 + t * t * p2;
  }

  // --- DRAWING HELPERS ---
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawYarnBall(x, y, r, colorObj, dir, isFree, special, revealed, rotAngle = 0) {
    ctx.save();
    ctx.translate(x, y);

    // Soft shadow
    ctx.fillStyle = 'rgba(65, 38, 16, 0.2)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.85, r * 0.82, r * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(rotAngle);

    const cMain = revealed ? colorObj.main : '#8d8075';
    const cLight = revealed ? colorObj.light : '#b5a89d';
    const cDark = revealed ? colorObj.dark : '#594f47';

    // Base sphere gradient
    const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    grad.addColorStop(0, cLight);
    grad.addColorStop(0.55, cMain);
    grad.addColorStop(1, cDark);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Clip inside sphere to draw realistic overlapping yarn strands
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.96, 0, Math.PI * 2);
    ctx.clip();

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = Math.max(1.5, r * 0.08);
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(i * r * 0.28, -r * 0.15, r * 0.85, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(-r * 0.15, i * r * 0.28, r * 0.85, -1.2, 1.2);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(i * r * 0.35, r * 0.2, r * 0.78, Math.PI + 0.3, Math.PI * 2 - 0.3);
      ctx.stroke();
    }
    ctx.restore();

    // Outer subtle rim
    ctx.strokeStyle = isFree ? 'rgba(255, 255, 255, 0.85)' : 'rgba(50, 30, 15, 0.28)';
    ctx.lineWidth = isFree ? 2.4 : 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.rotate(-rotAngle);

    // Special icons or Natural Knitted Arrow directly on top of the yarn ball
    if (!revealed) {
      ctx.fillStyle = '#fff8ee';
      ctx.font = `900 ${Math.round(r * 0.95)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', 0, 1);
    } else if (dir) {
      drawKnittedArrowOnBall(r, dir, isFree);
    }

    if (special === 'bomb' && revealed) {
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(r * 0.58, -r * 0.58, r * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffbe0b';
      ctx.font = `bold ${Math.round(r * 0.42)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦', r * 0.58, -r * 0.57);
    }

    ctx.restore();
  }

  function drawKnittedArrowOnBall(r, dir, isFree) {
    ctx.save();
    let angle = 0;
    if (dir.name === 'R') angle = 0;
    else if (dir.name === 'D') angle = Math.PI / 2;
    else if (dir.name === 'L') angle = Math.PI;
    else if (dir.name === 'U') angle = -Math.PI / 2;
    ctx.rotate(angle);

    const len = r * 0.52;
    const head = r * 0.28;

    // Embossed yarn shadow under arrow
    ctx.strokeStyle = 'rgba(35, 18, 5, 0.45)';
    ctx.lineWidth = Math.max(4, r * 0.22);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-len * 0.7, 2);
    ctx.lineTo(len * 0.65, 2);
    ctx.moveTo(len * 0.65 - head, -head + 2);
    ctx.lineTo(len * 0.65, 2);
    ctx.lineTo(len * 0.65 - head, head + 2);
    ctx.stroke();

    // Main soft wool thread arrow
    ctx.strokeStyle = isFree ? '#ffffff' : 'rgba(255, 250, 240, 0.72)';
    ctx.lineWidth = Math.max(3.2, r * 0.18);
    ctx.beginPath();
    ctx.moveTo(-len * 0.7, 0);
    ctx.lineTo(len * 0.65, 0);
    ctx.moveTo(len * 0.65 - head, -head);
    ctx.lineTo(len * 0.65, 0);
    ctx.lineTo(len * 0.65 - head, head);
    ctx.stroke();

    ctx.restore();
  }

  function drawCatAndBucket() {
    const cx = W * 0.5;
    const topY = UI.catAreaY;
    const h = UI.catAreaH;
    const catY = topY + h * 0.34;
    const scale = Math.min(1, h / 175);

    ctx.save();
    ctx.translate(cx, catY);
    ctx.scale(scale, scale);

    // Cat body
    ctx.fillStyle = '#f49d42';
    ctx.beginPath();
    ctx.ellipse(0, 38, 36, 32, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cream belly
    ctx.fillStyle = '#ffe8cc';
    ctx.beginPath();
    ctx.ellipse(0, 42, 22, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ears (droop slightly when sulking)
    const earDroop = catMood === 'sulk' ? 0.24 : (catMood === 'angry' ? -0.12 : 0);
    [-1, 1].forEach(side => {
      ctx.save();
      ctx.translate(side * 24, -22);
      ctx.rotate(side * earDroop);
      ctx.fillStyle = '#f49d42';
      ctx.beginPath();
      ctx.moveTo(-12, 8);
      ctx.lineTo(side * 4, -22);
      ctx.lineTo(14, 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffb4a2';
      ctx.beginPath();
      ctx.moveTo(-7, 5);
      ctx.lineTo(side * 3, -14);
      ctx.lineTo(8, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Cat head
    ctx.fillStyle = '#f49d42';
    ctx.beginPath();
    ctx.ellipse(0, 0, 38, 31, 0, 0, Math.PI * 2);
    ctx.fill();

    // Forehead stripes
    ctx.fillStyle = '#c86d1f';
    roundRect(-3, -28, 6, 11, 3); ctx.fill();
    roundRect(-13, -25, 5, 9, 2.5); ctx.fill();
    roundRect(8, -25, 5, 9, 2.5); ctx.fill();

    // Facial expressions based on catMood
    if (catMood === 'laugh') {
      // Closed happy laughing eyes ^ ^
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      [-14, 14].forEach(ex => {
        ctx.beginPath();
        ctx.arc(ex, -2, 7, Math.PI + 0.3, -0.3);
        ctx.stroke();
      });
      // Big laughing mouth
      ctx.fillStyle = '#d94e4e';
      ctx.beginPath();
      ctx.arc(0, 10, 10, 0, Math.PI);
      ctx.fill();
    } else if (catMood === 'angry') {
      // Angry furrowed brows + wide eyes
      [-14, 14].forEach(ex => {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex, -1, 7.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2b1810';
        ctx.beginPath();
        ctx.arc(ex, -1, 4, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(-22, -11); ctx.lineTo(-7, -5);
      ctx.moveTo(22, -11); ctx.lineTo(7, -5);
      ctx.stroke();
      // Jagged angry mouth
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-9, 13); ctx.lineTo(-4, 9); ctx.lineTo(0, 13); ctx.lineTo(4, 9); ctx.lineTo(9, 13);
      ctx.stroke();
    } else if (catMood === 'sulk') {
      // Natural mild sulking / pouting expression (no tears, subtle frown)
      [-14, 14].forEach(ex => {
        ctx.fillStyle = '#2b1810';
        ctx.beginPath();
        ctx.arc(ex, 0, 5.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex - 1.5, -1.8, 1.8, 0, Math.PI * 2);
        ctx.fill();
      });
      // Soft slanted brows
      ctx.strokeStyle = '#5c3419';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-21, -6); ctx.lineTo(-8, -9);
      ctx.moveTo(21, -6); ctx.lineTo(8, -9);
      ctx.stroke();
      // Subtle pout mouth
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 2.3;
      ctx.beginPath();
      ctx.arc(0, 14, 6, Math.PI + 0.4, -0.4);
      ctx.stroke();
    } else {
      // Idle / smug / sweat
      [-14, 14].forEach(ex => {
        ctx.fillStyle = '#2b1810';
        ctx.beginPath();
        ctx.arc(ex, -1, 5.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex - 1.8, -2.8, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      if (catMood === 'smug') {
        ctx.strokeStyle = '#3b2314';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-20, -8); ctx.lineTo(-8, -6);
        ctx.moveTo(20, -8); ctx.lineTo(8, -6);
        ctx.stroke();
      }
      if (catMood === 'sweat') {
        ctx.fillStyle = '#6ec4f2';
        ctx.beginPath();
        ctx.arc(28, -10, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      // Cute cat mouth
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-4, 9, 4, 0, Math.PI * 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(4, 9, 4, Math.PI * 0.15, Math.PI);
      ctx.stroke();
    }

    // Pink nose
    ctx.fillStyle = '#ff758f';
    ctx.beginPath();
    ctx.arc(0, 5, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Equipped Wardrobe Accessory
    drawAccessory(save.equippedItem);

    // Paws holding the bucket
    ctx.fillStyle = '#ffe8cc';
    ctx.beginPath();
    ctx.arc(-28, 42, 9, 0, Math.PI * 2);
    ctx.arc(28, 42, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Draw the Color Bucket right in front of the cat
    const curBucket = buckets[0];
    if (curBucket) {
      drawBucket(cx, topY + h * 0.68, curBucket, scale);
    }
  }

  function drawAccessory(item) {
    if (item === 'bow') {
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.moveTo(0, 25); ctx.lineTo(-12, 19); ctx.lineTo(-12, 31); ctx.closePath();
      ctx.moveTo(0, 25); ctx.lineTo(12, 19); ctx.lineTo(12, 31); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffccd5';
      ctx.beginPath(); ctx.arc(0, 25, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (item === 'glasses') {
      ctx.fillStyle = '#1d1e2c';
      roundRect(-25, -7, 21, 13, 4); ctx.fill();
      roundRect(4, -7, 21, 13, 4); ctx.fill();
      ctx.fillRect(-4, -3, 8, 3);
    } else if (item === 'crown') {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(-16, -26); ctx.lineTo(-19, -42); ctx.lineTo(-7, -33);
      ctx.lineTo(0, -45); ctx.lineTo(7, -33); ctx.lineTo(19, -42); ctx.lineTo(16, -26);
      ctx.closePath();
      ctx.fill();
    } else if (item === 'wizard') {
      ctx.fillStyle = '#5e60ce';
      ctx.beginPath();
      ctx.ellipse(0, -25, 28, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-18, -25); ctx.lineTo(4, -56); ctx.lineTo(18, -25);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBucket(x, y, bucket, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const bw = bucket.isBoss ? 104 : 84;
    const bh = 54;

    // Bucket shadow
    ctx.fillStyle = 'rgba(50, 28, 12, 0.22)';
    ctx.beginPath();
    ctx.ellipse(0, bh * 0.52, bw * 0.46, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Bucket body (trapezoid)
    ctx.beginPath();
    ctx.moveTo(-bw * 0.5, -bh * 0.45);
    ctx.lineTo(bw * 0.5, -bh * 0.45);
    ctx.lineTo(bw * 0.38, bh * 0.48);
    ctx.lineTo(-bw * 0.38, bh * 0.48);
    ctx.closePath();

    if (bucket.isRainbow) {
      const rg = ctx.createLinearGradient(-bw * 0.5, 0, bw * 0.5, 0);
      rg.addColorStop(0, '#ff595e');
      rg.addColorStop(0.25, '#ffca3a');
      rg.addColorStop(0.5, '#8ac926');
      rg.addColorStop(0.75, '#1982c4');
      rg.addColorStop(1, '#6a4c93');
      ctx.fillStyle = rg;
      ctx.fill();
    } else if (bucket.colors.length === 2) {
      ctx.save();
      ctx.clip();
      ctx.fillStyle = bucket.colors[0].main;
      ctx.fillRect(-bw, -bh, bw, bh * 2);
      ctx.fillStyle = bucket.colors[1].main;
      ctx.fillRect(0, -bh, bw, bh * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = bucket.colors[0].main;
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Top rim
    ctx.fillStyle = '#fff8ee';
    roundRect(-bw * 0.53, -bh * 0.55, bw * 1.06, 10, 5);
    ctx.fill();

    // Count indicator (e.g. 1/3 or 2/3 + 1/3)
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 4;
    if (bucket.colors.length === 2) {
      ctx.fillText(`${bucket.counts[0]}/3   ${bucket.counts[1]}/3`, 0, 5);
    } else {
      ctx.fillText(`${bucket.counts[0]}/${bucket.maxPerColor}`, 0, 5);
    }
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  // --- MAIN RENDER ---
  function render() {
    ctx.save();
    ctx.scale(DPR, DPR);

    if (shakeTimer > 0) {
      ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    }

    // Warm knitted felt background
    ctx.fillStyle = '#f5e6d3';
    ctx.fillRect(0, 0, W, H);

    // Subtle woven texture lines
    ctx.strokeStyle = 'rgba(180, 140, 100, 0.08)';
    ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 16) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // --- TOP HUD BAR ---
    const { sound, lang, shop } = UI.buttons;

    // Sound btn
    ctx.fillStyle = '#fff8ee';
    roundRect(sound.x, sound.y, sound.w, sound.h, 12);
    ctx.fill();
    ctx.fillStyle = '#5c3d28';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(save.sound ? '🔊' : '🔇', sound.x + sound.w / 2, sound.y + sound.h / 2 + 1);

    // Lang btn
    ctx.fillStyle = '#fff8ee';
    roundRect(lang.x, lang.y, lang.w, lang.h, 12);
    ctx.fill();
    ctx.fillStyle = '#5c3d28';
    ctx.font = '800 13px sans-serif';
    ctx.fillText(save.lang.toUpperCase(), lang.x + lang.w / 2, lang.y + lang.h / 2 + 1);

    // Level & Coins Pill in center
    const isBoss = save.level % 5 === 0;
    ctx.fillStyle = isBoss ? '#d94e4e' : '#5c3d28';
    roundRect(W * 0.5 - 64, UI.topY, 128, 40, 20);
    ctx.fill();
    ctx.fillStyle = '#fff8ee';
    ctx.font = '800 14px sans-serif';
    ctx.fillText(isBoss ? `${t('boss')} ${save.level}` : `${t('level')} ${save.level}`, W * 0.5, UI.topY + 14);
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 12px sans-serif';
    ctx.fillText(`🪙 ${save.coins}`, W * 0.5, UI.topY + 30);

    // Wardrobe Shop btn
    ctx.fillStyle = '#fff8ee';
    roundRect(shop.x, shop.y, shop.w, shop.h, 12);
    ctx.fill();
    ctx.font = '18px sans-serif';
    ctx.fillText('🎩', shop.x + shop.w / 2, shop.y + shop.h / 2 + 1);

    // Combo Banner
    if (streak >= 3) {
      ctx.fillStyle = '#ff9f1c';
      roundRect(W * 0.5 - 78, UI.catAreaY - 2, 156, 20, 10);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 11px sans-serif';
      ctx.fillText(t('combo'), W * 0.5, UI.catAreaY + 8);
    }

    // --- CAT & BUCKET ---
    drawCatAndBucket();

    // --- 4-SLOT WAITING RACK ---
    const rackW = Math.min(W - 32, 340);
    const rackX = (W - rackW) * 0.5;
    ctx.fillStyle = '#dfc3a3';
    roundRect(rackX, UI.rackY, rackW, UI.rackH, 16);
    ctx.fill();
    ctx.strokeStyle = rack.length >= 3 ? '#e63946' : '#c4a17b';
    ctx.lineWidth = rack.length >= 3 ? 2.5 : 1.5;
    ctx.stroke();

    ctx.fillStyle = '#6e4b32';
    ctx.font = '800 10px sans-serif';
    ctx.fillText(`${t('rackTitle')} (${rack.length}/4)`, W * 0.5, UI.rackY + 12);

    for (let i = 0; i < 4; i++) {
      const sc = getRackSlotCoords(i);
      ctx.fillStyle = 'rgba(92, 61, 40, 0.14)';
      ctx.beginPath();
      ctx.arc(sc.x, sc.y, 19, 0, Math.PI * 2);
      ctx.fill();

      if (rack[i] && !rack[i].hiddenWhileFlying) {
        drawYarnBall(sc.x, sc.y, 18, rack[i].color, null, false, 'normal', true, 0);
      }
    }

    // --- YARN BALL BOARD ---
    ctx.fillStyle = 'rgba(223, 195, 163, 0.55)';
    roundRect(UI.boardX, UI.boardY, UI.boardW, UI.boardH, 18);
    ctx.fill();

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ball = grid[r][c];
        if (!ball) continue;
        const pos = getCellCenter(c, r);
        const free = isBallFree(ball);
        const sx = ball.shake > 0 ? Math.sin(ball.shake * 40) * 4 : 0;
        drawYarnBall(pos.x + sx, pos.y, pos.radius, ball.color, ball.dir, free, ball.special, ball.revealed, 0);
      }
    }

    // --- FLYING YARN BALLS ---
    for (const fb of flyingBalls) {
      const tt = Math.min(1, fb.t);
      const fx = quadBezier(fb.sx, fb.cx, fb.tx, tt);
      const fy = quadBezier(fb.sy, fb.cy, fb.ty, tt);
      const scale = 1 + Math.sin(tt * Math.PI) * 0.25;
      drawYarnBall(fx, fy, 19 * scale, fb.color, null, true, 'normal', true, tt * Math.PI * 4);
    }

    // --- KNITTED GIFTS & PARTICLES ---
    for (const g of knittedGifts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, g.life);
      ctx.fillStyle = g.color;
      roundRect(g.x - 16, g.y - 12, 32, 24, 6);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('🧶', g.x, g.y + 1);
      ctx.restore();
    }

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // --- BOTTOM BOOSTERS BAR ---
    drawBoostersBar();

    // --- OVERLAY MODALS (WIN / LOSE / WARDROBE / ADSIM) ---
    if (gameState !== 'playing') {
      drawModalOverlay();
    }

    ctx.restore();
  }

  function getBoosterRects() {
    const gap = 8;
    const totalW = W - 28;
    const bw = (totalW - gap * 3) / 4;
    const keys = ['clearSlot', 'target', 'shuffle', 'auto'];
    const icons = ['🧹', '🎯', '🔀', '✨'];
    return keys.map((key, i) => ({
      key,
      icon: icons[i],
      x: 14 + i * (bw + gap),
      y: UI.boosterY,
      w: bw,
      h: UI.boosterH
    }));
  }

  function drawBoostersBar() {
    const items = getBoosterRects();
    for (const b of items) {
      const cnt = save.boosters[b.key] || 0;
      const isSelected = b.key === 'target' && targetMode;
      ctx.fillStyle = isSelected ? '#ff9f1c' : '#fff8ee';
      roundRect(b.x, b.y, b.w, b.h, 14);
      ctx.fill();
      ctx.strokeStyle = isSelected ? '#d94e4e' : '#d4b494';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.icon, b.x + b.w * 0.5, b.y + b.h * 0.42);

      // Badge count or +Ad
      ctx.fillStyle = cnt > 0 ? '#38a169' : '#e63946';
      roundRect(b.x + b.w * 0.5 - 22, b.y + b.h - 20, 44, 16, 8);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 10px sans-serif';
      ctx.fillText(cnt > 0 ? `${cnt}` : '+AD', b.x + b.w * 0.5, b.y + b.h - 12);
    }

    if (targetMode) {
      ctx.fillStyle = 'rgba(40, 22, 10, 0.85)';
      roundRect(W * 0.5 - 120, UI.boosterY - 32, 240, 24, 12);
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.font = '700 12px sans-serif';
      ctx.fillText(t('targetHint'), W * 0.5, UI.boosterY - 20);
    }
  }

  let modalButtons = [];
  function drawModalOverlay() {
    modalButtons = [];
    ctx.fillStyle = 'rgba(35, 20, 10, 0.65)';
    ctx.fillRect(0, 0, W, H);

    const cardW = Math.min(W - 40, 340);
    const cardH = gameState === 'wardrobe' ? 370 : 280;
    const cx = (W - cardW) * 0.5;
    const cy = (H - cardH) * 0.5;

    ctx.fillStyle = '#fff8ee';
    roundRect(cx, cy, cardW, cardH, 22);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (gameState === 'lose') {
      ctx.fillStyle = '#e63946';
      ctx.font = '900 22px sans-serif';
      ctx.fillText(t('loseTitle'), W * 0.5, cy + 42);
      ctx.fillStyle = '#6e4b32';
      ctx.font = '600 14px sans-serif';
      ctx.fillText(t('loseSub'), W * 0.5, cy + 72);

      // Restart button (centered cleanly)
      const b2 = { x: cx + 20, y: cy + 135, w: cardW - 40, h: 48, action: 'restart' };
      ctx.fillStyle = '#38a169';
      roundRect(b2.x, b2.y, b2.w, b2.h, 14);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 15px sans-serif';
      ctx.fillText(t('restartBtn'), W * 0.5, b2.y + 24);
      modalButtons.push(b2);

    } else if (gameState === 'win') {
      ctx.fillStyle = '#38a169';
      ctx.font = '900 22px sans-serif';
      ctx.fillText(t('winTitle'), W * 0.5, cy + 38);
      ctx.fillStyle = '#6e4b32';
      ctx.font = '600 13px sans-serif';
      ctx.fillText(t('winSub'), W * 0.5, cy + 66);

      ctx.fillStyle = '#d97706';
      ctx.font = '900 18px sans-serif';
      ctx.fillText(`+${earnedCoinsThisLevel} 🪙`, W * 0.5, cy + 96);

      if (!doubledClaimed) {
        const bDouble = { x: cx + 20, y: cy + 122, w: cardW - 40, h: 46, action: 'doubleCoins' };
        ctx.fillStyle = '#ff9f1c';
        roundRect(bDouble.x, bDouble.y, bDouble.w, bDouble.h, 14);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '800 14px sans-serif';
        ctx.fillText(`🎬 ${t('doubleBtn')}`, W * 0.5, bDouble.y + 23);
        modalButtons.push(bDouble);
      }

      const bNext = { x: cx + 20, y: cy + 182, w: cardW - 40, h: 48, action: 'nextLevel' };
      ctx.fillStyle = '#38a169';
      roundRect(bNext.x, bNext.y, bNext.w, bNext.h, 14);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 15px sans-serif';
      ctx.fillText(t('nextBtn'), W * 0.5, bNext.y + 24);
      modalButtons.push(bNext);

    } else if (gameState === 'wardrobe') {
      ctx.fillStyle = '#5c3d28';
      ctx.font = '900 20px sans-serif';
      ctx.fillText(`🎩 ${t('wardrobe')}`, W * 0.5, cy + 32);

      const shopItems = [
        { id: 'none', price: 0, icon: '🐱' },
        { id: 'bow', price: 80, icon: '🎀' },
        { id: 'glasses', price: 150, icon: '🕶️' },
        { id: 'wizard', price: 250, icon: '🧙' },
        { id: 'crown', price: 400, icon: '👑' }
      ];

      shopItems.forEach((it, idx) => {
        const ry = cy + 62 + idx * 46;
        const owned = save.ownedItems.includes(it.id);
        const equipped = save.equippedItem === it.id;

        ctx.fillStyle = '#f3e2ce';
        roundRect(cx + 16, ry, cardW - 32, 38, 10);
        ctx.fill();

        ctx.textAlign = 'left';
        ctx.fillStyle = '#4a301d';
        ctx.font = '700 14px sans-serif';
        ctx.fillText(`${it.icon} ${t('items')[it.id]}`, cx + 26, ry + 19);

        const btn = { x: cx + cardW - 106, y: ry + 5, w: 82, h: 28, action: 'buyEquip', item: it };
        ctx.fillStyle = equipped ? '#38a169' : (owned ? '#2b8cbe' : '#ff9f1c');
        roundRect(btn.x, btn.y, btn.w, btn.h, 8);
        ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.font = '800 12px sans-serif';
        ctx.fillText(equipped ? t('equipped') : (owned ? t('equip') : `${it.price} 🪙`), btn.x + btn.w / 2, btn.y + 14);
        modalButtons.push(btn);
      });

      const bClose = { x: cx + 40, y: cy + cardH - 52, w: cardW - 80, h: 38, action: 'closeModal' };
      ctx.fillStyle = '#5c3d28';
      roundRect(bClose.x, bClose.y, bClose.w, bClose.h, 12);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 14px sans-serif';
      ctx.fillText(t('close'), W * 0.5, bClose.y + 19);
      modalButtons.push(bClose);

    } else if (gameState === 'adsim') {
      ctx.fillStyle = '#2b8cbe';
      ctx.font = '900 18px sans-serif';
      ctx.fillText(`🎬 ${t('adSimTitle')}`, W * 0.5, cy + 48);

      ctx.fillStyle = '#5c3d28';
      ctx.font = '600 13px sans-serif';
      const words = t('adSimDesc').split(' ');
      let line = '', ly = cy + 95;
      for (const w of words) {
        if ((line + w).length > 34) {
          ctx.fillText(line, W * 0.5, ly);
          line = w + ' ';
          ly += 20;
        } else {
          line += w + ' ';
        }
      }
      ctx.fillText(line, W * 0.5, ly);

      const bClaim = { x: cx + 30, y: cy + 185, w: cardW - 60, h: 48, action: 'claimAd' };
      ctx.fillStyle = '#38a169';
      roundRect(bClaim.x, bClaim.y, bClaim.w, bClaim.h, 14);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '800 15px sans-serif';
      ctx.fillText(`✓ ${t('claimReward')}`, W * 0.5, bClaim.y + 24);
      modalButtons.push(bClaim);
    }
  }

  function openAdSimulation(reason, onReward) {
    const prev = gameState;
    gameState = 'adsim';
    adSimPayload = { prev, onReward };
  }

  // --- INPUT HANDLING ---
  function hitTest(px, py, rect) {
    return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
  }

  function handlePointer(px, py) {
    if (gameState !== 'playing') {
      for (const b of modalButtons) {
        if (hitTest(px, py, b)) {
          sfx.tap();
if (b.action === 'restart') {
            generateLevel(save.level);
          } else if (b.action === 'nextLevel') {
            window.AdBridge.showInterstitial(() => generateLevel(save.level));
          } else if (b.action === 'doubleCoins') {
            window.AdBridge.showRewarded('doubleCoins', () => {
              save.coins += earnedCoinsThisLevel;
              doubledClaimed = true;
              persist();
            });
          } else if (b.action === 'buyEquip') {
            const it = b.item;
            if (save.ownedItems.includes(it.id)) {
              save.equippedItem = it.id;
              persist();
            } else if (save.coins >= it.price) {
              save.coins -= it.price;
              save.ownedItems.push(it.id);
              save.equippedItem = it.id;
              persist();
            }
          } else if (b.action === 'closeModal') {
            gameState = 'playing';
          } else if (b.action === 'claimAd') {
            const payload = adSimPayload;
            gameState = payload.prev;
            if (payload.onReward) payload.onReward();
          }
          return;
        }
      }
      return;
    }

    // Top bar buttons
    if (hitTest(px, py, UI.buttons.sound)) {
      save.sound = !save.sound;
      persist();
      if (save.sound) sfx.tap();
      return;
    }
    if (hitTest(px, py, UI.buttons.lang)) {
      save.lang = save.lang === 'tr' ? 'en' : 'tr';
      persist();
      sfx.tap();
      return;
    }
    if (hitTest(px, py, UI.buttons.shop)) {
      gameState = 'wardrobe';
      sfx.tap();
      return;
    }

    // Boosters bar
    for (const b of getBoosterRects()) {
      if (hitTest(px, py, b)) {
        const cnt = save.boosters[b.key] || 0;
        if (cnt <= 0) {
          window.AdBridge.showRewarded('booster_' + b.key, () => {
            save.boosters[b.key] = (save.boosters[b.key] || 0) + 1;
            persist();
          });
          return;
        }
        useBooster(b.key);
        return;
      }
    }

    // Board yarn balls
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ball = grid[r][c];
        if (!ball) continue;
        const pos = getCellCenter(c, r);
        const dist = Math.hypot(px - pos.x, py - pos.y);
        if (dist <= pos.radius * 1.12) {
          if (targetMode || isBallFree(ball)) {
            targetMode = false;
            launchBall(ball);
          } else {
            ball.shake = 0.5;
            sfx.blocked();
          }
          return;
        }
      }
    }
  }

  function useBooster(key) {
    if (key === 'clearSlot') {
      if (rack.length === 0) return;
      // Find an empty cell on grid so the yarn ball is NOT lost from its bucket count
      let emptyCell = null;
      for (let r = rows - 1; r >= 0 && !emptyCell; r--) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === null) {
            emptyCell = { c, r };
            break;
          }
        }
      }
      if (!emptyCell) return;
      save.boosters.clearSlot--;
      persist();
      const removed = rack.pop();
      grid[emptyCell.r][emptyCell.c] = {
        c: emptyCell.c,
        r: emptyCell.r,
        color: removed.color,
        dir: DIRS[0],
        special: 'normal',
        revealed: true,
        shake: 0.3,
        scale: 1
      };
      updateRevealed();
      spawnParticles(W * 0.5, UI.rackY + 34, removed.color.main, 14);
      sfx.tap();
    } else if (key === 'target') {
      targetMode = !targetMode;
      if (targetMode) {
        // Consume on actual shot or toggle
        save.boosters.target--;
        persist();
      }
      sfx.tap();
    } else if (key === 'shuffle') {
      save.boosters.shuffle--;
      persist();
      // Re-assign directions cleanly so new paths open
      const rem = new Set();
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c]) rem.add(`${c},${r}`);
        }
      }
      let guard = 0;
      while (rem.size > 0 && guard < 400) {
        guard++;
        const cands = [];
        rem.forEach(k => {
          const [cx, cy] = k.split(',').map(Number);
          const vd = DIRS.filter(d => {
            let nx = cx + d.dx, ny = cy + d.dy;
            while (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
              if (rem.has(`${nx},${ny}`)) return false;
              nx += d.dx; ny += d.dy;
            }
            return true;
          });
          if (vd.length) cands.push({ cx, cy, vd });
        });
        if (cands.length) {
          const p = cands[Math.floor(Math.random() * cands.length)];
          grid[p.cy][p.cx].dir = p.vd[Math.floor(Math.random() * p.vd.length)];
          rem.delete(`${p.cx},${p.cy}`);
        } else break;
      }
      updateRevealed();
      sfx.bucketFull();
    } else if (key === 'auto') {
      const cur = buckets[0];
      if (!cur) return;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const b = grid[r][c];
          if (b && canBucketAccept(cur, b.color.id)) {
            save.boosters.auto--;
            persist();
            launchBall(b);
            return;
          }
        }
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    handlePointer(px, py);
  });

  window.addEventListener('resize', resize);
  resize();
  generateLevel(save.level);

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
